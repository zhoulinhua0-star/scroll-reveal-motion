<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Scroll Reveal Motion</title>
  <desc id="desc">An Agent Skill for accessible viewport-entry motion, illustrated by content moving upward across a sixteen-percent viewport threshold into its settled state.</desc>

  <rect x="1" y="1" width="1198" height="418" rx="28" fill="#0B0D12" stroke="#2B303B" stroke-width="2"/>

  <g id="title-block" transform="translate(64 58)">
    <text fill="#9FA7B5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="2">AGENT SKILL · FRONTEND MOTION</text>

    <text y="72" fill="#F7F8FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="60" font-weight="760" letter-spacing="-2">Scroll Reveal</text>
    <text y="134" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="60" font-weight="760" letter-spacing="-2">Motion</text>

    <text y="188" fill="#D5D9E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23">Restrained viewport-entry motion with accessible defaults.</text>

    <g transform="translate(0 226)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600">
      <rect width="150" height="42" rx="21" fill="#191D26" stroke="#353B49"/>
      <text x="75" y="27" text-anchor="middle" fill="#E8EAF0">React / Next</text>

      <rect x="162" width="128" height="42" rx="21" fill="#191D26" stroke="#353B49"/>
      <text x="226" y="27" text-anchor="middle" fill="#E8EAF0">Vanilla JS</text>

      <rect x="302" width="188" height="42" rx="21" fill="#13221D" stroke="#286B52"/>
      <text x="396" y="27" text-anchor="middle" fill="#69D6A8">reduced-motion</text>
    </g>
  </g>

  <g id="motion-proof" transform="translate(674 42)">
    <rect width="462" height="336" rx="22" fill="#11141B" stroke="#303643" stroke-width="2"/>

    <g transform="translate(26 26)">
      <circle cx="6" cy="6" r="6" fill="#A78BFA"/>
      <text x="24" y="13" fill="#DDE1E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600">ONE-TIME REVEAL</text>
      <text x="410" y="13" text-anchor="end" fill="#7F8898" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">560ms</text>
    </g>

    <g id="settled-cards" transform="translate(28 76)">
      <rect width="406" height="58" rx="12" fill="#202532" stroke="#3A4252"/>
      <rect x="18" y="17" width="90" height="8" rx="4" fill="#A78BFA"/>
      <rect x="18" y="34" width="224" height="7" rx="3.5" fill="#6E7788"/>
      <text x="382" y="35" text-anchor="end" fill="#AEB5C2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">settled</text>

      <rect y="72" width="406" height="58" rx="12" fill="#1C212C" stroke="#343B49"/>
      <rect x="18" y="89" width="122" height="8" rx="4" fill="#8B79D8"/>
      <rect x="18" y="106" width="194" height="7" rx="3.5" fill="#636C7C"/>
      <text x="382" y="107" text-anchor="end" fill="#9EA6B4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">+90ms</text>
    </g>

    <line x1="28" y1="238" x2="434" y2="238" stroke="#4DD5A1" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="270" y="221" width="164" height="34" rx="17" fill="#13251F"/>
    <text x="352" y="243" text-anchor="middle" fill="#69D6A8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600">threshold 0.16</text>

    <g id="entering-card" transform="translate(28 268)" opacity="0.72">
      <rect width="406" height="44" rx="12" fill="#171B24" stroke="#5B526F" stroke-dasharray="7 7"/>
      <rect x="18" y="12" width="106" height="7" rx="3.5" fill="#7767A8"/>
      <rect x="18" y="26" width="178" height="6" rx="3" fill="#505867"/>
      <path d="M358 29v-15m-7 7 7-7 7 7" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="340" y="29" text-anchor="end" fill="#AEB5C2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">24px</text>
    </g>
  </g>
</svg>
